name: Report a problem
description: Something goes wrong while playing or in the editor.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping! Press F8 in the game (both sticks on a gamepad, or *Report a bug* in the pause menu): it fills in this form for you and saves a bug snapshot (a zip) you can drag onto *What went wrong?*.
        Please never attach the original game files.
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the report the game opens for you, or the name of the package you downloaded.
  - type: input
    id: system
    attributes:
      label: System and device
      description: For example "Windows 11, Xbox controller" or "Android 15, Pixel 8".
  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Indiana Jones and His Desktop Adventures
        - Star Wars Yoda Stories
        - Both
        - Not about a game
  - type: textarea
    id: snapshot
    attributes:
      label: Game state
      description: Where you were and what you had. The game fills this in; the snapshot zip has the full state.
      render: text
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The end of the game's log. The game fills this in; otherwise add log.txt from the app's folder.
      render: text
