name: Release

# A tag such as v0.2.0 builds every package and publishes them as a GitHub
# release; the version comes from the tag. Started by hand with a tag, it
# builds that tag again and adds the packages to its release. Started by hand
# without one, or by a pull request that changes the packaging, it only
# builds the packages (as workflow artifacts). See docs/releases.md.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - cmake/DasPackage.cmake
      - packaging/**
      - android/**
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to build again, such as v0.2.0 (empty: only build)"
        required: false
        default: ""

permissions:
  contents: read

env:
  # The release being made, or empty when only building.
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            # The oldest supported runner, so the program runs on older systems too.
            os: ubuntu-22.04
            configure: ""
          - name: Windows
            os: windows-latest
            # The C++ runtime linked in, so no Visual C++ redistributable is needed.
            configure: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          - name: macOS
            os: macos-latest
            # One program for Apple silicon and Intel Macs.
            configure: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || '' }}

      - name: Take the version from the tag
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag $RELEASE_TAG is not a version such as v1.2.3"
            exit 1
          fi
          perl -pi -e 's/^(\s*VERSION )[0-9.]+$/${1}'"${RELEASE_TAG#v}"'/' CMakeLists.txt
          grep -q "^ *VERSION ${RELEASE_TAG#v}$" CMakeLists.txt

      - name: Install SDL build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev wayland-protocols \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev \
            desktop-file-utils

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDAS_USE_SYSTEM_SDL3=OFF
          -DDAS_BUILD_TESTS=OFF ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        working-directory: build
        run: cpack -C Release

      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        run: packaging/linux/make-appimage.sh build build/packages

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: |
            build/packages/*.zip
            build/packages/*.tar.gz
            build/packages/*.dmg
            build/packages/*.AppImage
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || '' }}

      - name: Take the version from the tag
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag $RELEASE_TAG is not a version such as v1.2.3"
            exit 1
          fi
          perl -pi -e 's/^(\s*VERSION )[0-9.]+$/${1}'"${RELEASE_TAG#v}"'/' CMakeLists.txt
          grep -q "^ *VERSION ${RELEASE_TAG#v}$" CMakeLists.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.DAS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "DAS_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No DAS_KEYSTORE_BASE64 secret: the APK is signed with a debug key"
          fi

      - name: Build APK
        working-directory: android
        env:
          DAS_KEYSTORE_PASSWORD: ${{ secrets.DAS_KEYSTORE_PASSWORD }}
          DAS_KEY_ALIAS: ${{ secrets.DAS_KEY_ALIAS }}
          DAS_KEY_PASSWORD: ${{ secrets.DAS_KEY_PASSWORD }}
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9.]*\)$/\1/p' ../CMakeLists.txt | head -1)
          ./gradlew assembleRelease -PdasVersion="$version" --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk "../dist/DesktopAdventureStories-$version-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: package-Android
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Needs the files of the original games (Indiana Jones and His Desktop
          Adventures or Star Wars: Yoda Stories); they are not included.

          - Windows: unpack the zip and start DesktopAdventureStories.exe.
          - macOS: open the disk image and drag the app to Applications. The app
            is not signed: the first time, open it with right-click, Open.
          - Linux: download the AppImage, allow it to run as a program
            (right-click, Properties) and double-click it. The tar.gz holds
            the same program for those who prefer that.
          - Android: install the APK, then choose a zip of the game folder.
          NOTES
          # A release made on GitHub's release page (which also makes the
          # tag) gets the packages added; otherwise the release is made here.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            # Left without a title, GitHub shows the last commit message;
            # use the version instead.
            title=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json name --jq .name)
            if [ -z "$title" ]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG"
            fi
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --notes-file notes.md --generate-notes
          fi
