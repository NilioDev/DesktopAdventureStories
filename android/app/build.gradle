plugins {
    id "com.android.application"
}

// SDL's Android Java glue code (SDLActivity and friends) and its native code
// must come from the same checkout. It is cloned once into third_party/ and
// passed to CMake, so CMake does not download a second copy.
def sdlTag = project.property("dasSdlTag")
def sdlDir = rootProject.file("third_party/SDL-${sdlTag}")
if (!sdlDir.exists()) {
    logger.lifecycle("Cloning SDL ${sdlTag} into ${sdlDir}")
    def clone = ["git", "clone", "--depth", "1", "--branch", sdlTag,
                 "https://github.com/libsdl-org/SDL.git", sdlDir.absolutePath].execute()
    clone.waitForProcessOutput(System.out, System.err)
    if (clone.exitValue() != 0) {
        throw new GradleException("Could not clone SDL ${sdlTag}")
    }
}

// The version comes from the release (-PdasVersion=1.2.3), else the default.
def dasVersion = project.findProperty("dasVersion") ?: "0.1.1"
def versionParts = dasVersion.tokenize(".").collect { it.replaceAll("[^0-9]", "") as int }
while (versionParts.size() < 3) {
    versionParts << 0
}
def dasVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

// Releases are signed with the key given in the environment (see
// docs/releases.md); without it they get the debug key.
def releaseKeystore = System.getenv("DAS_KEYSTORE_FILE")

android {
    namespace "org.desktopadventurestories"
    compileSdk 35

    defaultConfig {
        applicationId "org.desktopadventurestories"
        minSdk 21
        targetSdk 35
        versionCode dasVersionCode
        versionName dasVersion

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          "-DDAS_BUILD_TESTS=OFF",
                          "-DDAS_SDL3_TAG=${sdlTag}",
                          "-DFETCHCONTENT_SOURCE_DIR_SDL3=${sdlDir.absolutePath}"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("DAS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("DAS_KEY_ALIAS")
                keyPassword System.getenv("DAS_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs += ["${sdlDir}/android-project/app/src/main/java"]
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.22.1"
        }
    }
}
